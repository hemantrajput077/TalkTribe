services:
  postgres:
    image: postgres:15-alpine
    container_name: talktribe_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talktribe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-talktribe_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talktribe}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talktribe

  redis:
    image: redis:7-alpine
    container_name: talktribe_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talktribe

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: talktribe_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-talktribe}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-talktribe_db}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_secret_key_change_in_production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - talktribe

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: talktribe_frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000}
    depends_on:
      - backend
    networks:
      - talktribe

volumes:
  postgres_data:
  redis_data:

networks:
  talktribe:
    driver: bridge
